# Runs the handful of tests that read Overture's live S3 release (see
# skip_if_not_live() in tests/testthat/helper.R). They run weekly rather than
# on every push, so a new Overture release breaks this job and not an
# unrelated pull request. Trigger it by hand from the Actions tab as well.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: live-tests

permissions: read-all

jobs:
  live-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OVERTURER_LIVE_TESTS: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Run live tests
        run: testthat::test_local(filter = "live", stop_on_failure = TRUE)
        shell: Rscript {0}
